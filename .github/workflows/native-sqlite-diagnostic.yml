name: Native SQLite diagnostic

# Evidence collection only. Required PR CI remains unchanged in ci.yml.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: SQLite diagnostic scope
        type: choice
        default: comparison
        options:
          - comparison
          - full-trace
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - '.github/workflows/native-sqlite-diagnostic.yml'
      - 'scripts/diagnostics/native-sqlite.init.gradle'
      - 'scripts/diagnostics/native_sqlite_comparison.sh'
      - 'docs/testing/NATIVE_SQLITE_DIAGNOSTIC.md'

permissions:
  contents: read

concurrency:
  group: native-sqlite-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sqlite-comparison:
    name: SQLite diagnostic (${{ inputs.mode || (contains(github.event.pull_request.labels.*.name, 'sqlite-full-trace') && 'full-trace') || 'comparison' }})
    if: github.event.action != 'labeled' || github.event.label.name == 'sqlite-full-trace'
    env:
      ATOMIC_SQLITE_DIAGNOSTIC_MODE: ${{ inputs.mode || (contains(github.event.pull_request.labels.*.name, 'sqlite-full-trace') && 'full-trace') || 'comparison' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Use normal CI Gradle memory for the full trace
        if: env.ATOMIC_SQLITE_DIAGNOSTIC_MODE == 'full-trace'
        shell: bash
        run: |
          mkdir -p ~/.gradle
          {
            echo "org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=768m"
            echo "kotlin.daemon.jvmargs=-Xmx2g -XX:+UseParallelGC -XX:MaxMetaspaceSize=512m"
          } >> ~/.gradle/gradle.properties
      - name: Collect diagnostic evidence
        shell: bash
        run: |
          chmod +x gradlew
          bash scripts/diagnostics/native_sqlite_comparison.sh "$ATOMIC_SQLITE_DIAGNOSTIC_MODE"
      - name: Upload complete diagnostic evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-sqlite-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/native-sqlite-diagnostic
          if-no-files-found: error
          retention-days: 14
