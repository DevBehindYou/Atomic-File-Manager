name: PDF source-session native acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/pdf-source-session-native.yml'
      - 'app/src/androidTest/kotlin/com/devbehindyou/atomicfilemanager/PdfSourceSessionDeviceTest.kt'
      - 'app/src/androidTest/kotlin/com/devbehindyou/atomicfilemanager/PdfReaderDeviceTest.kt'
      - 'app/src/main/kotlin/com/devbehindyou/atomicfilemanager/ui/components/preview/PdfPreviewContent.kt'
      - 'app/src/main/kotlin/com/devbehindyou/atomicfilemanager/ui/components/preview/PdfPageController.kt'
      - 'app/src/main/kotlin/com/devbehindyou/atomicfilemanager/data/preview/PdfPreviewHelper.kt'
      - 'app/src/main/kotlin/com/devbehindyou/atomicfilemanager/data/preview/PdfDocumentSession.kt'
      - 'app/src/main/res/values/pdf_strings.xml'

permissions:
  contents: read

concurrency:
  group: pdf-source-session-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pdf-source-session:
    strategy:
      fail-fast: false
      matrix:
        api: [28, 34]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure bounded build memory
        shell: bash
        run: |
          chmod +x gradlew
          mkdir -p ~/.gradle
          printf '%s\n' 'org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=768m' 'kotlin.daemon.jvmargs=-Xmx2g' >> ~/.gradle/gradle.properties
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run owned PDF source-session and renderer journeys
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew --no-daemon --max-workers=1 :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.devbehindyou.atomicfilemanager.PdfSourceSessionDeviceTest,com.devbehindyou.atomicfilemanager.PdfReaderDeviceTest
      - name: Capture artifact identities
        if: always()
        shell: bash
        run: |
          mkdir -p build/pdf-source-session-native
          git rev-parse HEAD > build/pdf-source-session-native/source.txt
          git rev-parse HEAD:app > build/pdf-source-session-native/app-tree.txt
          find app/build/outputs/apk -name '*.apk' -type f -exec sha256sum '{}' \; > build/pdf-source-session-native/apk-sha256.txt
      - name: Retain native reports and exact APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-source-session-native-api${{ matrix.api }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/pdf-source-session-native
            app/build/outputs/androidTest-results
            app/build/reports/androidTests
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 14
