name: CI

# Build and test run here, not on the developer machine (no Android SDK installed locally).
# Every push to main and every pull request runs static analysis, unit tests and APK
# packaging; the debug APK is uploaded as an artifact so it can be installed on a phone.
# The emulator job is manual only (Actions tab > CI > Run workflow).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      beta_asset_urls:
        description: Temporary download capabilities for the four intended-public beta assets
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Static analysis (ktlint, detekt, Lint)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The exec bit is lost when commits are made from Windows (core.fileMode=false), which
      # made `./gradlew` fail with "Permission denied" (exit 126). Do not rely on the git mode.
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The checked-in gradle.properties is sized for the low-memory dev machine. A Compose build of
      # this size crashed the Kotlin daemon with OutOfMemoryError there, so give CI a larger heap.
      - name: Configure Gradle memory
        run: |
          mkdir -p ~/.gradle
          {
            echo "org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=768m"
            echo "kotlin.daemon.jvmargs=-Xmx2g -XX:+UseParallelGC -XX:MaxMetaspaceSize=512m"
          } >> ~/.gradle/gradle.properties

      - name: Release transport guards (no network or credentials)
        run: |
          python3 -B scripts/release/test_beta_transport.py
          bash -n scripts/release/prepare_signed_beta.sh scripts/release/smoke_signed_beta.sh
      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: detekt
        run: ./gradlew detekt

      - name: Android Lint (debug and release), including custom checks
        run: ./gradlew :app:lintDebug :app:lintRelease

      - name: Upload static analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/ktlint
            app/build/reports/detekt
          if-no-files-found: ignore
          retention-days: 14

  unit-tests:
    name: Unit tests and APK packaging
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The exec bit is lost when commits are made from Windows (core.fileMode=false), which
      # made `./gradlew` fail with "Permission denied" (exit 126). Do not rely on the git mode.
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The checked-in gradle.properties is sized for the low-memory dev machine. A Compose build of
      # this size crashed the Kotlin daemon with OutOfMemoryError there, so give CI a larger heap.
      - name: Configure Gradle memory
        run: |
          mkdir -p ~/.gradle
          {
            echo "org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=768m"
            echo "kotlin.daemon.jvmargs=-Xmx2g -XX:+UseParallelGC -XX:MaxMetaspaceSize=512m"
          } >> ~/.gradle/gradle.properties

      - name: Run unit tests and package APKs
        run: >
          ./gradlew
          :lint-rules:test
          :app:testDebugUnitTest
          :app:assembleDebug
          :app:assembleRelease
          :app:assembleDebugAndroidTest
          :benchmark:assembleBenchmark

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            lint-rules/build/reports/tests
            app/build/reports/tests
          if-no-files-found: ignore
          retention-days: 14

      # Room writes its schema here during compilation; it is committed so migrations can be
      # tested against the real history (data/database/room/AtomicDatabase.kt).
      # Also printed, so the schema can be read from the log where artifact downloads are blocked.
      - name: Print Room schemas
        run: find app/schemas -name '*.json' -print -exec cat {} \; || true

      - name: Upload Room schemas
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas
          if-no-files-found: warn
          retention-days: 14

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: atomic-file-manager-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
          retention-days: 14

  instrumented-tests:
    name: Instrumented tests (emulator, manual)
    if: github.event_name == 'workflow_dispatch' && github.ref_name != 'codex/beta-0.2.0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The exec bit is lost when commits are made from Windows (core.fileMode=false), which
      # made `./gradlew` fail with "Permission denied" (exit 126). Do not rely on the git mode.
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The checked-in gradle.properties is sized for the low-memory dev machine. A Compose build of
      # this size crashed the Kotlin daemon with OutOfMemoryError there, so give CI a larger heap.
      - name: Configure Gradle memory
        run: |
          mkdir -p ~/.gradle
          {
            echo "org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=768m"
            echo "kotlin.daemon.jvmargs=-Xmx2g -XX:+UseParallelGC -XX:MaxMetaspaceSize=512m"
          } >> ~/.gradle/gradle.properties

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run connected tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          # Then the shrunk release APK: install, launch, and fail if the app process dies or
          # logs a fatal exception (R8 removing something reflection needs shows up here first).
          script: |
            ./gradlew :app:connectedDebugAndroidTest :app:assembleRelease
            adb uninstall com.devbehindyou.atomicfilemanager || true
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            adb shell am start -W -n com.devbehindyou.atomicfilemanager/.MainActivity
            sleep 10
            adb logcat -d -s AndroidRuntime:E > release-launch.log || true
            cat release-launch.log
            if grep -q "FATAL EXCEPTION" release-launch.log; then echo "Release build crashed on launch"; exit 1; fi
            adb shell pidof com.devbehindyou.atomicfilemanager
            # Plan 16.8: 10,000 random events on the release build; monkey exits non-zero on a
            # crash or ANR. System keys are off so it stays inside the app.
            adb shell monkey -p com.devbehindyou.atomicfilemanager --pct-syskeys 0 --throttle 20 -s 42 -v 10000 > monkey.log 2>&1 || { tail -60 monkey.log; echo "Monkey found a crash or ANR"; exit 1; }
            tail -5 monkey.log

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: app/build/reports/androidTests
          if-no-files-found: ignore
          retention-days: 14


  beta-signed-runtime:
    name: Signed beta APK runtime (emulator, manual)
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'codex/beta-0.2.0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Fetch and verify only the public signed APK from this source draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release/prepare_signed_beta.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke the exact dedicated-key R8 beta in a disposable emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/release/smoke_signed_beta.sh
      - name: Retain public beta smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signed-beta-smoke
          path: beta-smoke/
          if-no-files-found: ignore
          retention-days: 14

# Out of scope for now: the full emulator matrix (testing/DEVICE_MATRIX.md), screenshot
# tests and macrobenchmark (testing/TEST_STRATEGY.md §11).
