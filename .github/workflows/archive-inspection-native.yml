name: Archive inspection native acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/archive-inspection-native.yml'
      - 'app/src/androidTest/kotlin/com/devbehindyou/atomicfilemanager/ArchiveInspectionDeviceTest.kt'
      - 'app/src/main/kotlin/com/devbehindyou/atomicfilemanager/domain/usecase/InspectArchiveUseCase.kt'
      - 'app/src/main/kotlin/com/devbehindyou/atomicfilemanager/domain/usecase/ArchiveFormats.kt'
      - 'app/src/main/kotlin/com/devbehindyou/atomicfilemanager/data/backend/FileSystemBackend.kt'

permissions:
  contents: read

concurrency:
  group: archive-inspection-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive-inspection:
    strategy:
      fail-fast: false
      matrix:
        api: [28, 34]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure bounded build memory
        shell: bash
        run: |
          chmod +x gradlew
          mkdir -p ~/.gradle
          printf '%s\n' 'org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=768m' 'kotlin.daemon.jvmargs=-Xmx2g' >> ~/.gradle/gradle.properties
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Inspect owned TAR fixtures through the filesystem backend
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew --no-daemon --max-workers=1 :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.devbehindyou.atomicfilemanager.ArchiveInspectionDeviceTest
      - name: Capture artifact identities
        if: always()
        shell: bash
        run: |
          mkdir -p build/archive-inspection-native
          git rev-parse HEAD > build/archive-inspection-native/source.txt
          git rev-parse HEAD:app > build/archive-inspection-native/app-tree.txt
          find app/build/outputs/apk -name '*.apk' -type f -exec sha256sum '{}' \; > build/archive-inspection-native/apk-sha256.txt
      - name: Retain native reports and exact APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-inspection-native-api${{ matrix.api }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/archive-inspection-native
            app/build/outputs/androidTest-results
            app/build/reports/androidTests
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 14
