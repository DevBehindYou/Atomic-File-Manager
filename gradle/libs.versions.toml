# Atomic File Manager — version catalog
#
# Provenance key used in the comments below (see PHASE_1_NOTES.md for the full
# explanation of why this matters this phase):
#   [CONFIRMED]    — checked against an official source on 2026-08-28.
#   [BEST-EFFORT]  — a reasonable current value I could not directly confirm from this
#                    sandbox (no network access to Google's Maven / Maven Central here).
#                    Verify against the artifact's real metadata before the first build
#                    and correct in this one file if it's off — nothing else should need
#                    to change.

[versions]
# --- Core toolchain --------------------------------------------------------
agp = "9.1.1" # Matched to Gradle 9.3.1 toolchain
kotlin = "2.2.10" # [BEST-EFFORT] AGP 9.1's reported bundled default; AGP 9.3 may bundle a newer patch.
ksp = "2.3.12" # KSP 2.3+ is versioned independently of Kotlin and is the line meant to work with AGP 9 built-in Kotlin. Confirmed on Maven Central and the Gradle plugin portal (5 Oct 2026); compatibility with this build is proven by CI, not locally.
room = "2.7.2" # [BEST-EFFORT] Google Maven is not reachable from the build machine; 2.7.2 is a known published release.

# --- Compose -----------------------------------------------------------
# Pinned to the April '26 train (Compose 1.11.0) deliberately: the August '26 train
# (BOM 2026.08.00 / Compose 1.12.0) raises the *minimum* compileSdk to 37, which
# conflicts with TECH_STACK.md's compileSdk 36. Re-pin once the docs move to 37.
composeBom = "2026.04.01" # [CONFIRMED]
activityCompose = "1.10.1" # [BEST-EFFORT]

# --- Splash / DI / async -------------------------------------------------
androidxBiometric = "1.1.0" # [BEST-EFFORT] BiometricPrompt needs a FragmentActivity.
androidxFragment = "1.8.5" # [BEST-EFFORT] FragmentActivity for BiometricPrompt; needs activity 1.8+.
coreSplashscreen = "1.0.1" # [BEST-EFFORT] verify no newer stable exists.
hilt = "2.57.2" # [BEST-EFFORT, moderately confident]
kotlinxCoroutines = "1.9.0" # [BEST-EFFORT]
# Coil 3.3.0 is the newest release built with Kotlin 2.2 (3.4.0 needs 2.3, 3.5+ needs 2.4; this build
# compiles with 2.2.10). Maven Central, checked 6 Oct 2026. Raise together with the Kotlin version.
coil = "3.3.0"
profileinstaller = "1.4.1" # Installs the bundled baseline profiles (ours and Compose's) on sideloaded installs
metricsPerformance = "1.0.0-beta01" # JankStats, debug builds only (plan 16.1)
# RAR extract only (its licence forbids creating RAR, ALL_IN_ONE_PLAN.md 2.2). Maven Central, 7 Oct 2026.
junrar = "8.1.1"
# Encrypted ZIP (ZipCrypto and AES) read, Apache 2.0. Maven Central, 7 Oct 2026.
zip4j = "2.11.6"
# SFTP (ALL_IN_ONE_PLAN.md 3.1), Apache 2.0; brings BouncyCastle 1.84. Maven Central, 7 Oct 2026.
sshj = "0.41.1"
# SMB 2/3 (ALL_IN_ONE_PLAN.md 3.1), Apache 2.0; never negotiates SMB1. Maven Central, checked 7 Oct 2026.
smbj = "0.15.0"
# Labs: Android/data through Shizuku (ALL_IN_ONE_PLAN.md 4.3), Apache 2.0. Maven Central, checked 8 Oct 2026.
shizuku = "13.1.5"
# Declared directly: SftpBackend installs the full provider, and sshj only lists it at runtime.
# All three BouncyCastle jars are pinned together: smbj pulls bcprov up to 1.85.x, where a class
# moved from bcutil into bcprov, and a bcutil left behind at sshj's 1.84 then duplicates it.
bouncycastle = "1.86"
# In-process SSH/SFTP server for backend tests only, Apache 2.0.
apacheSshd = "2.20.0"
# Archive formats (ALL_IN_ONE_PLAN.md 2.2), Apache 2.0. XZ is optional in Commons Compress, so it is
# declared here. Maven Central, checked 6 Oct 2026.
commonsCompress = "1.28.0"
xz = "1.10"
# Preview player for audio and video (ALL_IN_ONE_PLAN.md 1.5). Picked without access to Google Maven
# from the cloud session; CI resolves it. Only stable (non-@UnstableApi) Media3 API is used.
media3 = "1.8.0"
# Encrypted vault (ALL_IN_ONE_PLAN.md 2.5), Apache 2.0. Maven Central, checked 6 Oct 2026.
tink = "1.23.0"
# Photo metadata view and clean copies (ALL_IN_ONE_PLAN.md 4.2). Picked without access to Google
# Maven from the cloud session; CI resolves it.
exifinterface = "1.4.1"

# --- Custom Lint module ----------------------------------------------------
# Lint's own artifact version has historically tracked "AGP version + 23 major", e.g.
# AGP 8.4 -> Lint 31.4. Extrapolated (NOT independently confirmed) to AGP 9.3 -> Lint 32.3.
# This is the single value most likely to need correcting — see PHASE_1_NOTES.md.
lintApi = "32.1.1"

# --- Test stack --------------------------------------------------------
androidJunit5Plugin = "2.0.1" # [BEST-EFFORT] bridges JUnit Platform into AGP's Android unit-test task.
junitJupiter = "5.11.4" # [BEST-EFFORT]
junitPlatform = "1.11.4"
junit4 = "4.13.2" # [CONFIRMED-BY-LONGSTANDING-STABILITY] used only for the one Robolectric smoke
                    # test — see PHASE_1_NOTES.md for why JUnit4+Robolectric was chosen over
                    # JUnit5+Robolectric for that one file. Bridged into the JUnit Platform via
                    # junit-vintage-engine below so the whole suite still runs through one runner.
robolectric = "4.14.1" # [BEST-EFFORT]
androidxTestCore = "1.6.1" # [BEST-EFFORT]

# --- Static analysis -----------------------------------------------------
detekt = "1.23.7" # [BEST-EFFORT]
ktlintGradle = "12.1.2" # [BEST-EFFORT]

# --- Benchmark module (added this hardening pass — see PHASE_1_NOTES.md §4) ------------
androidxTestExtJunit = "1.2.1" # [BEST-EFFORT]
androidxTestRunner = "1.6.2" # [BEST-EFFORT] a separate artifact from androidx.test.ext:junit —
                              # doesn't necessarily share its exact version, so tracked separately
                              # rather than assumed to match.
androidxBenchmark = "1.3.3" # [BEST-EFFORT] pins both the benchmark-macro-junit4 library
                              # and the androidx.benchmark Gradle plugin — they're released
                              # in lockstep and must match.

[libraries]
# Used only from build-logic/convention to apply plugins programmatically inside the
# precompiled convention-plugin scripts. Not consumed directly by :app or :lint-rules.
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-composeCompilerGradlePlugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }

compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }

activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "androidxBiometric" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "androidxFragment" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-video = { group = "io.coil-kt.coil3", name = "coil-video", version.ref = "coil" }
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }
androidx-metrics-performance = { group = "androidx.metrics", name = "metrics-performance", version.ref = "metricsPerformance" }
junrar = { group = "com.github.junrar", name = "junrar", version.ref = "junrar" }
zip4j = { group = "net.lingala.zip4j", name = "zip4j", version.ref = "zip4j" }
sshj = { group = "com.hierynomus", name = "sshj", version.ref = "sshj" }
smbj = { group = "com.hierynomus", name = "smbj", version.ref = "smbj" }
shizuku-api = { group = "dev.rikka.shizuku", name = "api", version.ref = "shizuku" }
shizuku-provider = { group = "dev.rikka.shizuku", name = "provider", version.ref = "shizuku" }
bouncycastle-prov = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }
bouncycastle-util = { group = "org.bouncycastle", name = "bcutil-jdk18on", version.ref = "bouncycastle" }
bouncycastle-pkix = { group = "org.bouncycastle", name = "bcpkix-jdk18on", version.ref = "bouncycastle" }
apache-sshd-core = { group = "org.apache.sshd", name = "sshd-core", version.ref = "apacheSshd" }
apache-sshd-sftp = { group = "org.apache.sshd", name = "sshd-sftp", version.ref = "apacheSshd" }
commons-compress = { group = "org.apache.commons", name = "commons-compress", version.ref = "commonsCompress" }
tukaani-xz = { group = "org.tukaani", name = "xz", version.ref = "xz" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifinterface" }
tink-android = { group = "com.google.crypto.tink", name = "tink-android", version.ref = "tink" }

hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }

room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }

kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }

lint-api = { group = "com.android.tools.lint", name = "lint-api", version.ref = "lintApi" }
lint-checks = { group = "com.android.tools.lint", name = "lint-checks", version.ref = "lintApi" }
lint-tests = { group = "com.android.tools.lint", name = "lint-tests", version.ref = "lintApi" }

junit-jupiter-api = { group = "org.junit.jupiter", name = "junit-jupiter-api", version.ref = "junitJupiter" }
junit-jupiter-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine", version.ref = "junitJupiter" }
junit-jupiter-params = { group = "org.junit.jupiter", name = "junit-jupiter-params", version.ref = "junitJupiter" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junitPlatform" }
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }
junit-vintage-engine = { group = "org.junit.vintage", name = "junit-vintage-engine", version.ref = "junitJupiter" }

robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }

androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "androidxBenchmark" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
# No `kotlin-compose` plugin alias here: org.jetbrains.kotlin.plugin.compose is applied
# via a bare id() inside build-logic/convention's atomic.android.application.gradle.kts,
# since its implementation is already on that module's own classpath
# (kotlin-composeCompilerGradlePlugin below). A version-catalog alias would be unused.
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
androidJunit5 = { id = "de.mannodermaus.android-junit", version.ref = "androidJunit5Plugin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
